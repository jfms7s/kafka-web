name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and unit tests (scripts/check.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python comes from backend/.python-version; a fresh sync compiles pyjks's twofish C
      # extension, which the runner's compiler and Python headers cover.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run scripts/check.sh
        env:
          # Makes check.sh also write the unit-test lcov fragments here (integration stays out).
          COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: scripts/check.sh
      # Runs only after check.sh succeeded; relative SF paths get the package directory prefixed.
      - name: Collect coverage fragments (eng-metrics-lab)
        run: |
          sed 's|^SF:\([^/]\)|SF:backend/\1|' "$RUNNER_TEMP/coverage/py.lcov" > "$RUNNER_TEMP/coverage-py.lcov"
          sed 's|^SF:\([^/]\)|SF:frontend/\1|' "$RUNNER_TEMP/coverage/ts/lcov.info" > "$RUNNER_TEMP/coverage-ts.lcov"
          mkdir -p .quality
          mv "$RUNNER_TEMP/coverage-py.lcov" "$RUNNER_TEMP/coverage-ts.lcov" .quality/
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fragments
          path: |
            .quality/coverage-py.lcov
            .quality/coverage-ts.lcov
          include-hidden-files: true
          retention-days: 7

  integration:
    name: Integration tests (Kafka in Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The runner's Docker daemon; locally the suite defaults to the user's rootless podman.
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      # PLAINTEXT and SASL_SSL brokers, each started by a session fixture in conftest.py.
      - name: Run the integration suite
        working-directory: backend
        run: uv run pytest -m integration -q

  # Report-only: never gates the build; fragments feed the quality-report image.
  quality:
    name: Code quality (report-only, eng-metrics-lab)
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        continue-on-error: true
      - name: Dead code, TypeScript (knip)
        run: |
          mkdir -p .quality
          cd frontend && npx --yes knip@5.88.1 --reporter json --no-exit-code > ../.quality/deadcode-ts.json
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-fragments
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true
